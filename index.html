<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data:; frame-src https://accounts.google.com/gsi/; connect-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3A0905">
<title>Sign in · Send A Scooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="card" id="card">
    <img class="logo" src="logo.webp" alt="Send A Scooter" width="92" height="68">
    <h1 id="title">Sign in to Send A Scooter</h1>
    <p class="sub" id="sub">Use your Google account. You'll go straight back to the app.</p>
    <div id="gbtn" class="gbtn" aria-live="polite"></div>
    <a id="back" class="back" hidden>Return to Send A Scooter</a>
    <p class="msg" id="msg" role="status"></p>
    <ul class="trust">
      <li>Google only shares your name and email with us</li>
      <li>We never see your Google password</li>
    </ul>
  </div>
  <p class="foot">Send A Scooter · errands by scooter, KwaZulu-Natal</p>
</main>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="app.js"></script>
</body>
</html>
